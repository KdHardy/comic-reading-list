name: Guarded deploy merge

on:
  issue_comment:
    types:
      - created

permissions:
  checks: read
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  merge:
    name: Validate deploy request and merge
    if: >-
      github.event.issue.pull_request
      && github.event.comment.body == '/deploy'
      && (
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
        || (
          github.event.comment.user.login == 'cursor[bot]'
          && github.event.comment.user.id == 206951365
          && github.event.comment.user.node_id == 'BOT_kgDODFXTxQ'
          && github.event.comment.user.type == 'Bot'
          && github.event.comment.performed_via_github_app.id == 1210556
          && github.event.comment.performed_via_github_app.node_id == 'A_kwHOB44z8s4AEni8'
          && github.event.comment.performed_via_github_app.slug == 'cursor'
          && github.event.comment.performed_via_github_app.owner.id == 126759922
          && github.event.comment.performed_via_github_app.owner.login == 'cursor'
          && github.event.comment.performed_via_github_app.owner.node_id == 'O_kgDOB44z8g'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the trusted workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate CI and merge the pinned revision
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const deploy = require('./.github/deploy/guarded-deploy.cjs');
            await deploy.run({ github, context, core });
